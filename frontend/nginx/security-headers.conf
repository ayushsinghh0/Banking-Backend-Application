# Included in every location that answers the browser (add_header is not inherited once a location sets its own).
# The CSP itself is built in default.conf.template ($banksphere_csp): scripts only from this origin (plus Razorpay
# Checkout when it is enabled), no inline script, no eval. Inline styles are allowed because the toast and dialog
# libraries inject small <style> elements; markup is always escaped by React.
add_header Content-Security-Policy $banksphere_csp always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy $banksphere_coop always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
