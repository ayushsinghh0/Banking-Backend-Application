# Production sizes. Requests are what the HPA's utilisation targets are measured against, so they track the
# measured steady state per replica (capacity plan); limits leave room for bursts and GC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      containers:
        - name: app
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "500m"
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
