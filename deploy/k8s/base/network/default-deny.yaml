# Nothing in the namespace talks to anything until a policy below says so. The allows mirror the Compose
# networks (backend/docker-compose.yml): edge = ingress -> web -> gateway, apps = gateway <-> services,
# backend = services -> data stores, egress = the few services that need the internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Cluster DNS for every pod (service names and the managed data stores' host names)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
