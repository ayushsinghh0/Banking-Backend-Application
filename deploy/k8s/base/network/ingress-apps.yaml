# Who may call whom (ingress side). Every edge also needs the matching egress rule in egress-apps.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes:
    - Ingress
  ingress:
    # Only the ingress controller (namespace and pod labels of a standard ingress-nginx install)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  policyTypes:
    - Ingress
  ingress:
    # Only through the web pods' nginx, which overwrites X-Forwarded-For (the gateway trusts exactly one hop)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-service-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  policyTypes:
    - Ingress
  ingress:
    # public auth API
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - protocol: TCP
          port: 8001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: customer-service-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: customer-service
  policyTypes:
    - Ingress
  ingress:
    # profiles/KYC; internal KYC checks (CUSTOMER_INTERNAL_TOKEN) and the assistant's tools
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: account-service
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: payment-service
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: assistant-service
      ports:
        - protocol: TCP
          port: 8002
---
