# customer-service: Customer profiles and KYC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: customer-service
  labels:
    app.kubernetes.io/name: customer-service
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  labels:
    app.kubernetes.io/name: customer-service
    app.kubernetes.io/component: service
    banksphere.io/runtime: node
spec:
  # No spec.replicas: the HorizontalPodAutoscaler owns the count, and a value here would reset it on every apply
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customer-service
        app.kubernetes.io/component: service
        banksphere.io/runtime: node
      annotations:
        # Annotation-based discovery for a plain Prometheus; the prometheus-operator component adds a PodMonitor
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: customer-service
      terminationGracePeriodSeconds: 45
      securityContext:
        # The image's USER is the name "node", which the kubelet cannot prove is non-root: give the uid explicitly
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: app
          image: banksphere/customer-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
            # Prometheus listener (METRICS_PORT); never exposed through the Service, the gateway or the ingress
            - name: metrics
              containerPort: 9464
              protocol: TCP
          envFrom:
            - configMapRef:
                name: banksphere-common
            - configMapRef:
                name: customer-service-config
            - secretRef:
                name: banksphere-jwt
            - secretRef:
                name: customer-service-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # /health checks this pod's own database and Redis connections: an unready pod leaves the Service and the
          # gateway's circuit breaker answers for it instead of timing out
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  labels:
    app.kubernetes.io/name: customer-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: customer-service
  ports:
    - name: http
      port: 8002
      targetPort: http
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: customer-service
  labels:
    app.kubernetes.io/name: customer-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: customer-service
  minReplicas: 2
  maxReplicas: 3
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: customer-service
  labels:
    app.kubernetes.io/name: customer-service
spec:
  maxUnavailable: 1
  # A crash-looping pod must never block a node drain
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-service
