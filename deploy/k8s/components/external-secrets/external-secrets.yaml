# Every Secret the workloads reference by name, materialised by the External Secrets Operator from the
# platform's secret manager. Only remote key PATHS live in git, never values. Each cluster has its own
# ClusterSecretStore called "banksphere" pointing at that environment's secret manager (separate account /
# project / Vault mount per environment), so the same paths resolve to staging or production values.
#
# Layout of the remote keys (one JSON document per path, one property per variable):
#   banksphere/<service>          that service's own credentials (DATABASE_URL with pgbouncer=true, Redis ACL URLs, ...)
#   banksphere/jwt                JWT_SIGNING_KEY, JWT_SIGNING_KEY_ID, JWT_VERIFY_KEYS
#   banksphere/internal-tokens    service-to-service bearer tokens, each shared by exactly its caller and callee
#   banksphere/kafka              one SCRAM password per Kafka user (auth-svc, ledger-svc, ...)
#   banksphere/migrate            schema OWNER URLs for the migration Job
# Rotation: change the value in the secret manager; ESO refreshes the Secret within refreshInterval, then
# restart the consumers (docs/operations/kubernetes.md, "Secrets"). deletionPolicy Retain: removing an
# ExternalSecret (or the operator) never takes running pods' credentials with it.

# Public verification keys (kid:base64 SPKI, comma-separated); rotate together with auth's signing key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: banksphere-jwt
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: banksphere
  target:
    name: banksphere-jwt
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: JWT_VERIFY_KEYS
      remoteRef:
        key: banksphere/jwt
        property: JWT_VERIFY_KEYS
---
