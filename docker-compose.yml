# BankSphere full stack.  cp .env.example .env  (fill in every CHANGE_ME), then:  docker compose up -d --build
# Only the API gateway is published to the host network; everything else is internal.

x-db-url: &db-base postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-banksphere}

x-service-env: &service-env
  NODE_ENV: production
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
  JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
  KAFKA_ENABLED: "true"
  KAFKA_BROKERS: kafka:29092
  REDIS_URL: redis://redis:6379

x-app: &app
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  # Primary Relational Database (Multi-schema for Microservice isolation)
  postgres:
    image: postgres:16-alpine
    container_name: banksphere-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-banksphere}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis for Caching, Sessions, and Distributed Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: banksphere-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Apache Kafka Broker (Event streaming backbone)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: banksphere-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: banksphere-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Kafka UI for inspecting topics (no auth: bound to localhost only, opt-in via --profile tools)
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: banksphere-kafka-ui
    profiles: ["tools"]
    depends_on:
      - kafka
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: banksphere-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # One-shot job: applies every service's Prisma migrations, then exits
  migrate:
    build: { context: ., target: build }
    environment:
      DB_BASE: *db-base
    command:
      - sh
      - -c
      - |
        set -e
        for s in auth:auth_schema customer:customer_schema account:account_schema transaction:ledger_schema notification:notification_schema fraud:fraud_schema; do
          svc=$${s%%:*}; schema=$${s##*:}
          echo "Migrating $$svc-service ($$schema)"
          (cd services/$$svc-service && DATABASE_URL="$$DB_BASE?schema=$$schema" npx prisma migrate deploy)
        done
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    <<: *app
    build: { context: ., args: { SERVICE: api-gateway } }
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      AUTH_SERVICE_URL: http://auth-service:8001
      CUSTOMER_SERVICE_URL: http://customer-service:8002
      ACCOUNT_SERVICE_URL: http://account-service:8003
      TRANSACTION_SERVICE_URL: http://transaction-service:8004
      NOTIFICATION_SERVICE_URL: http://notification-service:8005
      FRAUD_SERVICE_URL: http://fraud-service:8006

  auth-service:
    <<: *app
    build: { context: ., args: { SERVICE: auth-service } }
    environment:
      <<: *service-env
      PORT: 8001
      KAFKA_CLIENT_ID: auth-service
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=auth_schema"

  customer-service:
    <<: *app
    build: { context: ., args: { SERVICE: customer-service } }
    environment:
      <<: *service-env
      PORT: 8002
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=customer_schema"

  account-service:
    <<: *app
    build: { context: ., args: { SERVICE: account-service } }
    environment:
      <<: *service-env
      PORT: 8003
      KAFKA_CLIENT_ID: account-service
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
      LEDGER_SERVICE_URL: http://transaction-service:8004
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=account_schema"

  transaction-service:
    <<: *app
    build: { context: ., args: { SERVICE: transaction-service } }
    environment:
      <<: *service-env
      PORT: 8004
      KAFKA_CLIENT_ID: transaction-service
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=ledger_schema"

  notification-service:
    <<: *app
    build: { context: ., args: { SERVICE: notification-service } }
    environment:
      <<: *service-env
      PORT: 8005
      KAFKA_CLIENT_ID: notification-service
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=notification_schema"

  fraud-service:
    <<: *app
    build: { context: ., args: { SERVICE: fraud-service } }
    environment:
      <<: *service-env
      PORT: 8006
      KAFKA_CLIENT_ID: fraud-service
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=fraud_schema"

volumes:
  postgres_data:
  redis_data:
