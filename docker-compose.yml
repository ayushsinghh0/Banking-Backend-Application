# BankSphere production stack.
#   cp .env.example .env      # fill in every CHANGE_ME (see README > Configuration)
#   docker compose up -d --build
#   docker compose run --rm -e ADMIN_EMAIL=... -e ADMIN_PASSWORD=... auth-service node dist/scripts/create-admin.js
#
# Only the API gateway publishes a port. Put a TLS-terminating reverse proxy / load balancer in front of it.
# For local development add the dev overlay:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

x-node-healthcheck: &node-healthcheck
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 20s

x-service-env: &service-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TRUST_PROXY: "1" # requests arrive through the API gateway
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
  JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
  KAFKA_ENABLED: "true"
  KAFKA_BROKERS: kafka:29092

x-app: &app
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  healthcheck: *node-healthcheck
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16.4-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-banksphere}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:?set CUSTOMER_DB_PASSWORD in .env}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?set ACCOUNT_DB_PASSWORD in .env}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?set LEDGER_DB_PASSWORD in .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}
      FRAUD_DB_PASSWORD: ${FRAUD_DB_PASSWORD:?set FRAUD_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-schemas.sh:/docker-entrypoint-initdb.d/10-init-schemas.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # AOF persistence + noeviction: token revocation state must never be silently evicted
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper)
  kafka:
    image: apache/kafka:3.8.1
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # topics are created explicitly by kafka-init
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms384m -Xmx512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for t in user.registered.v1 account.created.v1 account.status.changed.v1 transaction.completed.v1 fraud.alert.created.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic $$t.dlq --partitions 1 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic notifications.dlq --partitions 1 --replication-factor 1
        echo "Kafka topics ready"

  # One-shot job: applies every service's migrations with that service's own database role
  migrate:
    build: { context: ., target: build }
    environment:
      AUTH_DATABASE_URL: postgresql://auth_svc:${AUTH_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=auth_schema
      CUSTOMER_DATABASE_URL: postgresql://customer_svc:${CUSTOMER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=customer_schema
      ACCOUNT_DATABASE_URL: postgresql://account_svc:${ACCOUNT_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=account_schema
      TRANSACTION_DATABASE_URL: postgresql://ledger_svc:${LEDGER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=ledger_schema
      NOTIFICATION_DATABASE_URL: postgresql://notification_svc:${NOTIFICATION_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=notification_schema
      FRAUD_DATABASE_URL: postgresql://fraud_svc:${FRAUD_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=fraud_schema
    command:
      - sh
      - -c
      - |
        set -e
        for s in AUTH:auth CUSTOMER:customer ACCOUNT:account TRANSACTION:transaction NOTIFICATION:notification FRAUD:fraud; do
          var=$${s%%:*}_DATABASE_URL; svc=$${s##*:}
          echo "Migrating $$svc-service"
          (cd services/$$svc-service && DATABASE_URL="$$(printenv $$var)" npx prisma migrate deploy)
        done
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    <<: *app
    build: { context: ., args: { SERVICE: api-gateway } }
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 8000
      TRUST_PROXY: ${GATEWAY_TRUST_PROXY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GATEWAY_RATE_LIMIT_PER_MINUTE: ${GATEWAY_RATE_LIMIT_PER_MINUTE:-300}
      AUTH_SERVICE_URL: http://auth-service:8001
      CUSTOMER_SERVICE_URL: http://customer-service:8002
      ACCOUNT_SERVICE_URL: http://account-service:8003
      TRANSACTION_SERVICE_URL: http://transaction-service:8004
      NOTIFICATION_SERVICE_URL: http://notification-service:8005
      FRAUD_SERVICE_URL: http://fraud-service:8006
    depends_on:
      redis: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      customer-service: { condition: service_healthy }
      account-service: { condition: service_healthy }
      transaction-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
      fraud-service: { condition: service_healthy }

  auth-service:
    <<: *app
    build: { context: ., args: { SERVICE: auth-service } }
    environment:
      <<: *service-env
      PORT: 8001
      KAFKA_CLIENT_ID: auth-service
      DATABASE_URL: postgresql://auth_svc:${AUTH_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=auth_schema
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL in .env}
      EMAIL_TRANSPORT: smtp
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}

  customer-service:
    <<: *app
    build: { context: ., args: { SERVICE: customer-service } }
    environment:
      <<: *service-env
      PORT: 8002
      DATABASE_URL: postgresql://customer_svc:${CUSTOMER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=customer_schema

  account-service:
    <<: *app
    build: { context: ., args: { SERVICE: account-service } }
    environment:
      <<: *service-env
      PORT: 8003
      KAFKA_CLIENT_ID: account-service
      LEDGER_SERVICE_URL: http://transaction-service:8004
      CUSTOMER_SERVICE_URL: http://customer-service:8002
      DATABASE_URL: postgresql://account_svc:${ACCOUNT_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=account_schema

  transaction-service:
    <<: *app
    build: { context: ., args: { SERVICE: transaction-service } }
    environment:
      <<: *service-env
      PORT: 8004
      KAFKA_CLIENT_ID: transaction-service
      DATABASE_URL: postgresql://ledger_svc:${LEDGER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=ledger_schema

  notification-service:
    <<: *app
    build: { context: ., args: { SERVICE: notification-service } }
    environment:
      <<: *service-env
      PORT: 8005
      KAFKA_CLIENT_ID: notification-service
      DATABASE_URL: postgresql://notification_svc:${NOTIFICATION_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=notification_schema
      SECURITY_ALERT_EMAIL: ${SECURITY_ALERT_EMAIL:?set SECURITY_ALERT_EMAIL in .env}
      EMAIL_TRANSPORT: smtp
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM}

  fraud-service:
    <<: *app
    build: { context: ., args: { SERVICE: fraud-service } }
    environment:
      <<: *service-env
      PORT: 8006
      KAFKA_CLIENT_ID: fraud-service
      DATABASE_URL: postgresql://fraud_svc:${FRAUD_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-banksphere}?schema=fraud_schema

volumes:
  postgres_data:
  redis_data:
  kafka_data:
